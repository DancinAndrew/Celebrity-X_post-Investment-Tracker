[project]
name = "x-consensus"
version = "0.1.0"
description = "追蹤 X 財經帳號的個股觀點，聚合成日／週／月共識。抓取層在 fetch.sh（ego-browser）。"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "yfinance>=0.2.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["x_consensus"]
